[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legato-fm"
version = "1.0.5"
description = "Linux-first terminal Last.fm client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "vista747"}]
keywords = ["lastfm", "cli", "music", "terminal", "scrobble"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.2",
  "tomlkit>=0.13",
  "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/vista747/legato"
Repository = "https://github.com/vista747/legato"
Issues = "https://github.com/vista747/legato/issues"

[project.scripts]
legato = "legato.cli:_run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
