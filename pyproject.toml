[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legato"
version = "0.3.0"
description = "Terminal-first Last.fm client (now playing + scrobble + stats + YouTube)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Julius"}]
keywords = ["lastfm", "cli", "scrobble"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "tomlkit>=0.13",
]

[project.scripts]
legato = "legato.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
