[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legato"
version = "0.4.0"
description = "Linux-first terminal Last.fm client (minimal output)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Julius"}]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.2",
  "tomlkit>=0.13",
  "click>=8.1",
]

[project.scripts]
legato = "legato.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
