[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legato"
version = "0.2.0-beta"
description = "Terminal-first Last.fm client (now playing + scrobble + stats)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "tomlkit>=0.13",
]

[project.scripts]
legato = "legato.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
